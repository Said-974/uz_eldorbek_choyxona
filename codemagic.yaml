workflows:
  android-release:
    name: Android Release Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.24.0
      java: 17
    scripts:
      - name: Environment sozlash
        script: |
          echo "SUPABASE_URL=https://dummy.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=dummy_key" >> .env

      - name: Android platformani yaratish
        script: |
          rm -rf android
          flutter create . --platforms=android --org uz.eldorbek --project-name uz_eldorbek_choyxona --no-pub

      - name: Paketlarni olish
        script: |
          flutter pub get

      - name: Plaginlar va Gradle xatolarini to'liq to'g'rilash
        script: |
          python3 -c "
          import os, re

          # 1. Asosiy app/build.gradle ni sozlash
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r', encoding='utf-8') as f:
                  c = f.read()
              c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
              c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
              c = c.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')
              with open(app_gradle, 'w', encoding='utf-8') as f:
                  f.write(c)

          # 2. Pub cache ichidagi barcha plaginlarning build.gradle fayllarini to'g'rilash
          cache_dir = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          if os.path.exists(cache_dir):
              for root, dirs, files in os.walk(cache_dir):
                  for file in files:
                      if file == 'build.gradle':
                          gpath = os.path.join(root, file)
                          with open(gpath, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()

                          # flutter.compileSdkVersion va boshqalarni to'g'ridan-to'g'ri sonlarga almashtirish
                          content = content.replace('flutter.compileSdkVersion', '35')
                          content = content.replace('flutter.minSdkVersion', '21')
                          content = content.replace('flutter.targetSdkVersion', '34')
                          content = content.replace('compileSdk flutter.compileSdkVersion', 'compileSdk 35')
                          content = content.replace('minSdk flutter.minSdkVersion', 'minSdk 21')
                          content = content.replace('targetSdk flutter.targetSdkVersion', 'targetSdk 34')

                          # namespace va compileSdkVersion qo'shish
                          if 'android {' in content and 'namespace' not in content:
                              mpath = os.path.join(root, 'src', 'main', 'AndroidManifest.xml')
                              ns = 'com.example.plugin'
                              if os.path.exists(mpath):
                                  with open(mpath, 'r', encoding='utf-8', errors='ignore') as mf:
                                      mcontent = mf.read()
                                  match = re.search(r'package=\"([^\"]+)\"', mcontent)
                                  if match:
                                      ns = match.group(1)
                              content = content.replace('android {', f'android {{\n    namespace \"{ns}\"\n    compileSdkVersion 35', 1)
                          elif 'android {' in content and 'compileSdkVersion' not in content and 'compileSdk' not in content:
                              content = content.replace('android {', 'android {\n    compileSdkVersion 35', 1)

                          with open(gpath, 'w', encoding='utf-8') as f:
                              f.write(content)
          "

      - name: Drift kod generatorini yurgizish
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Release APK yig'ish
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - makhmudov9911@gmail.com
