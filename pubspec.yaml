  # UI va Yordamchilar
  intl: ^0.20.3
  uuid: ^4.4.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - .env
