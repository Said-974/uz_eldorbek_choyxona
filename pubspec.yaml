name: uz_eldorbek_choyxona
description: "Eldorbek Choyxonasi POS tizimi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Holat boshqaruvi va DI
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  get_it: ^7.6.7

  # Cloud Backend (Supabase)
  supabase_flutter: ^2.5.4

  # Lokal SQLite Baza (Drift)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.2
  path: ^1.9.0

  # Bluetooth Printer
  blue_thermal_printer: ^1.2.3
