name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4

      - name: ☕ Java 17 o'rnatish
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Flutter SDK o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 📄 .env faylini yaratish
        run: |
          echo "SUPABASE_URL=https://dummy.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=dummy_key" >> .env

      - name: 🛠️ Android platformani toza yaratish
        run: |
          rm -rf android
          flutter create . --platforms=android --org uz.eldorbek --project-name uz_eldorbek_choyxona

      - name: 🔧 Android SDK 35 va minSdk 21 sozlash
        run: |
          python3 -c "
          import os
          for root, _, files in os.walk('android'):
              for file in files:
                  if file.endswith('.gradle') or file.endswith('.gradle.kts'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8') as f:
                          c = f.read()
                      c = c.replace('flutter.compileSdkVersion', '35')
                      c = c.replace('flutter.minSdkVersion', '21')
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(c)
          "

      - name: 📦 Paketlarni yuklash
        run: flutter pub get

      - name: ⚙️ Drift va kod generatorini ishga tushirish
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔨 Release APK yig'ish
        run: flutter build apk --release

      - name: 📤 APK ni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: eldorbek-choyxona-apk
          path: build/app/outputs/flutter-apk/app-release.apk
