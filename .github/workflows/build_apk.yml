name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v4

      - name: ☕ Java 17 o'rnatish
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Flutter SDK o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 📄 .env faylini yaratish
        run: |
          echo "SUPABASE_URL=https://dummy.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=dummy_key" >> .env

      - name: 🛠️ Android platformani toza yaratish
        run: |
          rm -rf android
          flutter create . --platforms=android --org uz.eldorbek --project-name uz_eldorbek_choyxona

      - name: 🔧 Plaginlar va Android SDK 35 ni to'liq sozlash
        run: |
          python3 -c "
          # app/build.gradle ni sozlash
          app_gradle = 'android/app/build.gradle'
          with open(app_gradle, 'r') as f:
              text = f.read()
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
          text = text.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')
          with open(app_gradle, 'w') as f:
              f.write(text)

          # root build.gradle ga barcha plaginlar uchun compileSdk 35 qo'shish
          root_gradle = 'android/build.gradle'
          subprojects_config = '''
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 35
                          buildToolsVersion '35.0.0'
                      }
                  }
              }
          }
          '''
          with open(root_gradle, 'a') as f:
              f.write(subprojects_config)
          "

      - name: 📦 Paketlarni yuklash
        run: flutter pub get

      - name: ⚙️ Drift va kod generatorini ishga tushirish
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔨 Release APK yig'ish
        run: flutter build apk --release

      - name: 📤 APK ni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: eldorbek-choyxona-apk
          path: build/app/outputs/flutter-apk/app-release.apk
